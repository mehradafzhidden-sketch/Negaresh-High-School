<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6558d3"><title>ورود | مدرسه نگرش</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#f5f6fc;color:#24233c;font-family:Tahoma,"Segoe UI",sans-serif}.panel{width:min(100%,420px);background:white;border:1px solid #e8e8f2;border-radius:20px;padding:26px;box-shadow:0 12px 35px #24233c0d}h1{margin:0 0 8px;font-size:25px;color:#6558d3}p{line-height:1.8;color:#66677b}label{display:block;margin:16px 0 7px}input{width:100%;padding:12px;border:1px solid #d9d9e8;border-radius:10px;font:inherit}button{width:100%;margin-top:20px;padding:12px;border:0;border-radius:10px;background:#6558d3;color:white;font:inherit;cursor:pointer}#message{font-size:14px;color:#a12a36;min-height:24px}.hint{font-size:12px;background:#fff6d9;padding:12px;border-radius:10px}
</style></head><body><main class="panel"><h1>مدرسه نگرش</h1><p>برای ورود، نام کاربری و رمز عبوری را وارد کنید که مدیر سامانه برای شما تعیین کرده است.</p><form id="login"><label for="username">نام کاربری</label><input id="username" name="username" autocomplete="username" required maxlength="40"><label for="password">رمز عبور</label><input id="password" name="password" type="password" autocomplete="current-password" required><button id="submit" type="submit">ورود به سامانه</button><div id="message" role="alert"></div></form><p class="hint">اگر هنوز حسابی برای شما ساخته نشده، از مدیر سامانه بخواهید حساب ایجاد کند. ثبت‌نام عمومی غیرفعال است.</p></main>
<script>
if(location.protocol!=="https:"&&location.hostname!=="localhost")document.getElementById("message").textContent="برای ورود امن، نشانی HTTPS لازم است.";
fetch("/api/auth/me").then(r=>{if(r.ok)location.replace("/")}).catch(()=>{});
document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const btn=document.getElementById("submit"),msg=document.getElementById("message");btn.disabled=true;msg.textContent="در حال بررسی…";try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:document.getElementById("username").value,password:document.getElementById("password").value})});const data=await r.json();if(!r.ok){msg.textContent=data.message||"ورود انجام نشد. تنظیمات مدیر یا اطلاعات ورود را بررسی کنید.";return}location.replace("/")}catch(_){msg.textContent="ارتباط با سامانه برقرار نشد."}finally{btn.disabled=false}});
</script></body></html>
